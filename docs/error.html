<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>404</title>
		<style>
body {
	margin: 0;
	height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	background: #1a1b26; /* Tokyo Night bg */
	color: #c0caf5; /* main text */
	font-family: SauceCodePro NFM !important;
}

	.container {
		text-align: center;
	}

	h1 {
		font-size: 2rem; /* reduced size */
		font-weight: 500;
		color: #bb9af7; /* purple accent */
		margin-bottom: 10px;
	}

	p {
		font-size: 0.95rem;
		color: #9aa5ce; /* subtle secondary text */
		margin-bottom: 25px;
	}

	a {
		font-size: 0.9rem;
		color: #7aa2f7;
		text-decoration: none;
		border-bottom: 1px solid #7aa2f7;
		padding-bottom: 2px;
		transition: opacity 0.2s ease;
	}

	a:hover {
		opacity: 0.7;
	}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>404 — not found</h1>
			<p>the page you're looking for doesn’t exist or has been moved.</p>
			<a href="/">go back home</a>
		</div>
	</body>
</html>
